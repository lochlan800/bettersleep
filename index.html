    <script>
      // GitHub Pages SPA: restore route from 404.html redirect
      (function(){
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
      (function(){
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          var path = decoded.split('?')[0];
          var query = decoded.split('?').slice(1).join('?');
          window.history.replaceState(null, null,
            l.pathname + path + (query ? '?' + query : '') + l.hash
          );
        }
      })();
    </script>

  <body>
    <div id="root"></div>
    <script>
      // Register service worker for PWA support
      if ('serviceWorker' in navigator) {
        // When a new service worker takes control the cached assets it holds
        // have changed, so reload once to pick up the new build. Without this
        // an installed app can sit on an old version until it is uninstalled.
        var swRefreshing = false
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (swRefreshing) return
          swRefreshing = true
          window.location.reload()
        })

        navigator.serviceWorker.register('/bettersleep/sw.js').then(function (reg) {
          // Check on load and when the tab is reopened, so a returning user
          // gets the current version without needing a hard refresh.
          reg.update()
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') reg.update()
          })
        }).catch(function (err) {
          console.log('Service worker registration failed:', err)
        })
      }
    </script>
